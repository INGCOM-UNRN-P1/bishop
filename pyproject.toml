[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bishop"
version = "0.1.0"
description = "Visualizador pedagógico de memoria C (Stack, Heap y punteros) en terminal y diagramas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
bishop = "bishop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bishop"]

[tool.pytest.ini_options]
pythonpath = ["src"]
